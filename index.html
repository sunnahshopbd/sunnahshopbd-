<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunnah Shop</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}
header{
    background:#0b6b3a;
    color:#fff;
    text-align:center;
    padding:20px;
}
header h1{
    margin:0;
}
.hero{
    text-align:center;
    padding:40px 20px;
}
.hero h2{
    color:#0b6b3a;
}
.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}
.card{
    width:220px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    padding:15px;
    text-align:center;
}
.card img{
    width:100%;
    border-radius:8px;
}
.btn{
    display:inline-block;
    margin-top:10px;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:5px;
}
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>🕌 Sunnah Shop</h1>
<p>Premium আতর | টুপি | পাঞ্জাবি | ইসলামিক পণ্য</p>
</header>

<section class="hero">
<h2>স্বাগতম সুন্নাহ শপে</h2>
<p>আপনার পছন্দের ইসলামিক পণ্য সহজেই অর্ডার করুন।</p>

<a class="btn" href="https://wa.me/8801000000000">
WhatsApp Order
</a>

</section>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/220x220" alt="">
<h3>প্রিমিয়াম আতর</h3>
<p>দীর্ঘস্থায়ী সুগন্ধি</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/220x220" alt="">
<h3>টুপি</h3>
<p>স্টাইলিশ ও আরামদায়ক</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/220x220" alt="">
<h3>পাঞ্জাবি</h3>
<p>প্রিমিয়াম কোয়ালিটি</p>
</div>

</section>

<footer>
© 2026 Sunnah Shop | All Rights Reserved
</footer>

</body>
</html>
